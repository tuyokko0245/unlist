name: リマインダー送信

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: リマインダー送信 API を呼ぶ
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://unlist-pi.vercel.app/api/cron/reminders
